name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

    # paths-ignore:
    #   - "**/*.md"
    #   - "docs/**"

  # push:
  #   branches:
  #     - main

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  nix-runtime:
    name: Nix runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node.js and pnpm
        run: |
          nix develop -c node --version
          nix develop -c pnpm --version

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Prepare tracking assets
        run: nix develop -c pnpm setup:tracking

      - name: Build
        run: nix develop -c pnpm build

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # nix/fixed-node.nix のバージョンと合わせる
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Test
      #   run: pnpm test

      # - name: Typecheck
      #   run: pnpm typecheck

      - name: Check lint script
        id: lint-script
        run: |
          if pnpm pkg get scripts.lint | grep -qv '^{}$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.lint-script.outputs.exists == 'true'
        run: pnpm lint

      # public/tracking/ is generated locally and is not checked into Git.
      - name: Prepare tracking assets
        run: pnpm setup:tracking

      - name: Build
        run: pnpm build
